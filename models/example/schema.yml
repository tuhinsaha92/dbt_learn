    description: Raw data for the jaffle shop application.
    database: SNOWFLAKE_SAMPLE_DATA       # Optional depending on your warehouse
    schema: TPCH_SF10         # The schema where the raw table lives
    tables:
      - name: CUSTOMER
        description: Raw orders table containing transaction records.
